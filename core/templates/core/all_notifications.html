{% extends 'base.html' %}

{% block content %}
  <h2>All Notifications</h2>
  
  {% if notifications %}
    <ul>
      {% for notification in notifications %}
        <li>
          {{ notification.message }}<br>
          <small>{{ notification.created_at}}</small>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No notifications yet.</p>
  {% endif %}
  
  <a href="{% url 'dashboard' %}">Back to Dashboard</a>
{% endblock %}
