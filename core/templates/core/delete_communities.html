{% extends 'base.html' %}
{% block title %}Delete Community - Uni Hub{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="bg-white shadow-lg rounded-xl p-8 max-w-md w-full">
    <h2 class="text-xl font-semibold mb-4 text-center text-red-600">Are you sure you want to delete this community?</h2>
    <p class="text-center text-gray-600 mb-6">"{{ community.name }}"</p>
    <form method="post">
      {% csrf_token %}
      <div class="flex justify-center space-x-4">
        <a href="{% url 'core:manage_communities' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-2 px-4 rounded">Cancel</a>
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded">Delete</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
