{% extends 'base.html' %}

{% block title %}Edit Comment - Uni Hub{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h1 class="text-xl font-bold text-gray-900 mb-4">Edit Comment</h1>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <textarea name="content" rows="4"
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">{{ comment.content }}</textarea>
            </div>
            <div class="flex justify-between">
                <a href="{% url 'core:post_detail' comment.post.id %}"
                    class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300">
                    Cancel
                </a>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
